name: Build ELF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Instalar git
        run: apk add --no-cache git

      - uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Subir ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps2browser-elf
          path: ps2browser.elf
